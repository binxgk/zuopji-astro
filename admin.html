<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>后台管理 — 氷子</title>
    <style>
/* ---- 基础重置 ---- */
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ---- 自定义滚动条 ---- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #C5D9D5; }
::-webkit-scrollbar-thumb { background: #7FEFD0; border-radius: 8px; }

/* ---- 根变量 ---- */
:root {
  --bg-deep: #ffffff;
  --bg-card: #E6DFDF;
  --text-primary: #1a1a24;
  --text-secondary: #5a5a6e;
  --text-muted: #88889a;
  --accent: #7FEFD0;
  --accent-light: #78FFC7;
  --accent-glow: rgba(127, 239, 208, 0.25);
  --accent-dark: #5acba0;
  --border: rgba(0, 0, 0, 0.06);
  --border-light: rgba(0, 0, 0, 0.1);
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.06);
  --shadow-hover: 0 15px 30px rgba(0, 0, 0, 0.1);
}

/* ---- Body ---- */
body {
  font-family: 'Inter', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  color: var(--text-primary);
  line-height: 1.5;
  background-color: var(--bg-deep);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ---- 模糊背景层 ---- */
.bg-blur-layer {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  background-size: cover; background-position: center;
  background-color: var(--bg-deep);
  filter: blur(30px) brightness(0.95);
  z-index: -1; transform: scale(1.1);
}

/* ---- 顶部导航 ---- */
.top-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.8rem 1.5rem;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  background: rgba(127, 239, 208, 0.85);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.nav-logo {
  color: var(--text-primary); font-size: 1rem; font-weight: 600;
  text-decoration: none; letter-spacing: -0.01em;
}
.nav-links { display: flex; gap: 0.5rem; align-items: center; }
.nav-links a {
  color: var(--text-secondary); font-size: 0.8rem; cursor: pointer;
  text-decoration: none; transition: color 0.2s;
  padding: 4px 10px; border-radius: 20px;
  background: none; border: none; font-family: inherit;
}
.nav-links a:hover { color: var(--text-primary); }
.nav-links a.active { color: var(--text-primary); background: rgba(0, 0, 0, 0.06); }

/* ---- 内容容器 ---- */
.container {
  max-width: 1200px; margin: 0 auto; padding: 2rem 1rem 4rem;
}

/* ---- Hero 区域 ---- */
.pricing-hero { text-align: center; padding: 3rem 0 1.5rem; }
.pricing-eyebrow {
  font-size: 0.75rem; font-weight: 700; letter-spacing: 0.25em;
  color: var(--accent-dark); margin-bottom: 0.6rem; text-transform: uppercase;
}
.pricing-hero h1 {
  font-size: clamp(2rem, 7vw, 3.2rem); font-weight: 700;
  letter-spacing: -0.02em; line-height: 1.1;
  color: var(--text-primary); margin-bottom: 0.5rem;
}
.pricing-subtitle {
  font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6;
}

/* ---- Section Title ---- */
.pricing-section-title {
  font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em;
  color: var(--text-primary); margin-bottom: 1rem; padding-left: 0.2rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.pricing-section-title::before {
  content: ''; display: inline-block; width: 3px; height: 1em;
  background: var(--accent); border-radius: 2px;
}

/* ---- 页脚 ---- */
.site-footer {
  text-align: center; padding: 1.5rem; font-size: 0.75rem;
  color: #797979; border-top: 1px solid var(--border);
}

/* ============================================
   Admin Page Styles
   ============================================ */
.admin-tabs {
  display: flex; gap: 0.5rem; margin-bottom: 2rem;
  justify-content: center; flex-wrap: wrap;
}
.admin-tab {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 40px; padding: 8px 20px;
  font-size: 0.82rem; font-weight: 600; color: var(--text-secondary);
  cursor: pointer; transition: background 0.2s, border-color 0.2s, color 0.2s;
  font-family: inherit;
}
.admin-tab:hover {
  background: rgba(127, 239, 208, 0.15); color: var(--text-primary);
}
.admin-tab.active {
  background: var(--accent); border-color: var(--accent-light); color: #1a1a24;
}

.admin-panel { display: none; }
.admin-panel.active {
  display: block;
  animation: pricingFadeUp 0.5s ease forwards;
}

.admin-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0.8rem;
}

.admin-section-title {
  font-size: 0.95rem; font-weight: 600; color: var(--text-primary);
  margin: 0; display: flex; align-items: center; gap: 0.5rem;
}
.admin-section-title::before {
  content: ''; display: inline-block; width: 3px; height: 1em;
  background: var(--accent); border-radius: 2px;
}

/* ---- 2列网格 ---- */
.admin-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
}
.admin-pricing-list {
  display: flex; flex-direction: column; gap: 0.6rem;
}

/* ---- 紧凑卡片 ---- */
.admin-list-item {
  background: rgba(255,255,255,0.5); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0.7rem 0.8rem;
  position: relative; transition: box-shadow 0.2s;
}
.admin-list-item:hover { box-shadow: var(--shadow-card); }
.admin-list-item-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0.4rem;
}
.admin-list-item-title {
  font-size: 0.78rem; font-weight: 600; color: var(--text-primary);
  line-height: 1.3;
}
.admin-list-item-fields {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;
}
.admin-list-item-field {
  display: flex; flex-direction: column; gap: 1px;
}
.admin-list-item-field label {
  font-size: 0.6rem; color: var(--text-muted); font-weight: 500;
}

.admin-photo-card {
  display: flex; flex-direction: column;
}
.admin-photo-card .photo-card-info { flex: 1; min-width: 0; }
.admin-photo-card .photo-card-tags {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
  padding-top: 0.5rem; margin-top: 0.5rem;
  border-top: 1px solid var(--border);
}
.admin-list-item-tags {
  display: flex; flex-wrap: wrap; gap: 0.4rem;
}
.admin-tag {
  font-size: 1rem; padding: 4px 12px; border-radius: 20px;
  background: rgba(127, 239, 208, 0.2); color: var(--accent-dark); font-weight: 600;
}
.admin-tag-remove {
  cursor: pointer; margin-left: 4px; opacity: 0.6; font-size: 0.85rem;
}
.admin-tag-remove:hover { opacity: 1; }

.admin-btn-del {
  background: rgba(220, 80, 80, 0.1); color: #c44;
  font-size: 1rem; padding: 4px 14px;
}

/* ---- 注意事项合并卡片 ---- */
.admin-notes-card {
  background: rgba(255,255,255,0.5); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0.8rem; margin-top: 1.5rem;
}
.admin-notes-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;
  padding: 0.5rem 0; border-bottom: 1px solid var(--border);
}
.admin-notes-row:last-child { border-bottom: none; }
.admin-notes-row .note-title-input { font-weight: 600; }
.admin-notes-row .note-desc-input { font-size: 0.78rem; }

/* ---- 表单控件 ---- */
.admin-input {
  background: rgba(255,255,255,0.7); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 0.78rem;
  color: var(--text-primary); font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s; outline: none; width: 100%;
}
.admin-input:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
}
.admin-textarea {
  background: rgba(255,255,255,0.7); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font-size: 0.78rem;
  color: var(--text-primary); font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s; outline: none;
  resize: vertical; min-height: 40px; width: 100%;
}
.admin-textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
}
.admin-input-sm { width: 60px; text-align: center; }

/* ---- 按钮 ---- */
.admin-btn {
  border: none; border-radius: var(--radius-sm); padding: 6px 14px;
  font-size: 0.72rem; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: background 0.2s, border-color 0.2s, color 0.2s, transform 0.2s;
  white-space: nowrap;
}
.admin-btn-save {
  background: var(--accent); color: #1a1a24; font-size: 1rem; padding: 8px 20px;
}
.admin-btn-save:hover { background: var(--accent-light); transform: translateY(-1px); }
.admin-btn-add {
  background: rgba(127, 239, 208, 0.2); color: var(--accent-dark);
  font-size: 1rem; padding: 6px 16px;
}
.admin-btn-add:hover { background: rgba(127, 239, 208, 0.35); }
.admin-btn-export {
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-primary); font-size: 1rem; padding: 8px 20px;
}
.admin-btn-export:hover { background: rgba(127, 239, 208, 0.15); }
.admin-btn-import {
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text-primary); display: inline-flex; align-items: center;
  font-size: 1rem; padding: 8px 20px; cursor: pointer;
}
.admin-btn-import:hover { background: rgba(127, 239, 208, 0.15); }
.admin-btn-reset {
  background: rgba(220, 80, 80, 0.08); border: 1px solid rgba(220, 80, 80, 0.2);
  color: #c44; font-size: 1rem; padding: 8px 20px;
}
.admin-btn-reset:hover { background: rgba(220, 80, 80, 0.15); }

.admin-actions { display: flex; justify-content: center; }

/* ---- 导出区域 ---- */
.admin-export-section {
  margin-top: 2.5rem; opacity: 0;
  animation: pricingFadeUp 0.7s 0.3s ease forwards;
}
.admin-export-btns {
  display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 1rem;
}
.admin-export-tip {
  font-size: 0.78rem; color: var(--text-muted); line-height: 1.6;
}
.admin-export-tip code {
  background: rgba(0,0,0,0.06); padding: 2px 6px;
  border-radius: 4px; font-size: 0.75rem;
}

/* ---- Toast ---- */
.admin-toast {
  position: fixed; bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1a1a24; color: #fff; padding: 10px 24px;
  border-radius: 40px; font-size: 0.82rem; font-weight: 500;
  z-index: 9999;
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s;
  opacity: 0; pointer-events: none;
}
.admin-toast.show {
  transform: translateX(-50%) translateY(0); opacity: 1;
}

/* ---- Animation ---- */
@keyframes pricingFadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ---- Responsive ---- */
@media (max-width: 900px) {
  .admin-grid { grid-template-columns: 1fr; }
  .admin-list-item-fields { grid-template-columns: 1fr; }
  .admin-export-btns { flex-direction: column; }
}

          </div>

        </div>
        <div class="admin-notes-card" id="zhengpianNotesCard">
          <div class="admin-panel-header">
            <h3 class="admin-section-title">正片注意事项</h3>
            <button class="admin-btn admin-btn-add" onclick="addNote('zhengpianNotes')">+ 新增</button>
          </div>
          <div id="zhengpianNotesList"></div>
        </div>
        <div class="admin-actions" style="margin-top:1.5rem">
          <button class="admin-btn admin-btn-save" onclick="savePricing()">保存价格配置</button>
        </div>
      </div>

      <section class="admin-export-section">
        <h2 class="pricing-section-title">数据导入 / 导出</h2>
        <div class="admin-export-btns">
          <button class="admin-btn admin-btn-export" onclick="exportConfig()">导出完整配置 JSON</button>
          <label class="admin-btn admin-btn-import">
            导入配置 JSON
            <input type="file" accept=".json" onchange="importConfig(event)" style="display:none" />
          </label>
          <button class="admin-btn admin-btn-reset" onclick="resetConfig()">重置为默认数据</button>
        </div>
        <p class="admin-export-tip">导出后将 JSON 内容替换到 <code>src/data/site-config.json</code> 即可同步到源码。</p>
      </section>

      <div class="admin-toast" id="adminToast"></div>
    </main>

          ],
          "zhengpianNotes": [
            { "title":"定金","desc":"正片定金 150 元" },
            { "title":"出图工期","desc":"正片出图工期 7~14 天，如有特效合成可能会因工作量需延迟" },
            { "title":"迟到说明","desc":"单主迟到一小时默认取消拍摄（提前说明可延迟最多一小时）" },
            { "title":"路费说明","desc":"有地铁直达无需单主报销，目的地离地铁超过 2 公里需单主报销" }
          ]
        }
      };

      var STORAGE_KEY = 'aura_admin_config';

      function getConfig() {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved) { try { return JSON.parse(saved); } catch(e) {} }
        return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      }

      function setConfig(cfg) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
      }

      var config = getConfig();

      function showToast(msg) {
        var t = document.getElementById('adminToast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2000);
      }

      function esc(s) {
        return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
      }

      // ---- Tab 切换 ----
      document.getElementById('adminTabs').addEventListener('click', function(e) {
        var btn = e.target.closest('.admin-tab');
        if (!btn) return;
        var tab = btn.dataset.tab;
        document.querySelectorAll('.admin-tab').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.admin-panel').forEach(function(p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('panel-' + tab).classList.add('active');
      });

      // ============================================
      // 作品管理
      // ============================================
      function renderPhotoList() {
        var list = document.getElementById('photoList');
        if (!list) return;
        list.innerHTML = config.photos.map(function(p, i) {
          var imagesStr = (p.images||[]).join(', ');
          var tagsHtml = (p.tags||[]).map(function(t, ti) {
            return '<span class="admin-tag">' + esc(t) + ' <span class="admin-tag-remove" onclick="removePhotoTag(' + i + ',' + ti + ')">&times;</span></span>';
          }).join('');
          return '<div class="admin-list-item admin-photo-card" data-idx="' + i + '">' +
            '<div class="photo-card-info">' +
              '<div class="admin-list-item-header">' +
                '<span class="admin-list-item-title">' + esc(p.title || '未命名') + ' &mdash; ' + esc(p.ip || '') + '</span>' +
                '<button class="admin-btn admin-btn-del" onclick="deletePhoto(' + i + ')">删除</button>' +
              '</div>' +
              '<div class="admin-list-item-fields">' +
                '<div class="admin-list-item-field"><label>角色名</label><input class="admin-input" value="' + esc(p.title) + '" onchange="updatePhoto(' + i + ',\'title\',this.value)" /></div>' +
                '<div class="admin-list-item-field"><label>IP</label><input class="admin-input" value="' + esc(p.ip) + '" onchange="updatePhoto(' + i + ',\'ip\',this.value)" /></div>' +
                '<div class="admin-list-item-field"><label>模特</label><input class="admin-input" value="' + esc(p.model) + '" onchange="updatePhoto(' + i + ',\'model\',this.value)" /></div>' +
                '<div class="admin-list-item-field"><label>图片文件（逗号分隔）</label><input class="admin-input" value="' + esc(imagesStr) + '" onchange="updatePhoto(' + i + ',\'images\',this.value.split(\',\').map(function(s){return s.trim()}).filter(Boolean))" /></div>' +
              '</div>' +
            '</div>' +
            '<div class="photo-card-tags">' + tagsHtml +
              '<input class="admin-input" style="width:90px;padding:3px 8px;font-size:0.75rem" placeholder="+标签" onkeydown="if(event.key===\'Enter\'){addPhotoTag(' + i + ',this.value);this.value=\'\'}" />' +
            '</div>' +
          '</div>';
        }).join('');
      }

      window.updatePhoto = function(idx, field, value) {
        config.photos[idx][field] = value;
      };

      window.deletePhoto = function(idx) {
        if (!confirm('确定删除该作品？')) return;
        config.photos.splice(idx, 1);
        renderPhotoList();
        showToast('已删除作品');
      };

      window.addPhoto = function() {
        var maxId = config.photos.reduce(function(max, p) { return Math.max(max, parseInt(p.id) || 0); }, 0);
        var newId = String(maxId + 1);
        if (newId.length < 2) newId = '0' + newId;
        config.photos.push({
          id: newId, title: '新作品', ip: '', model: '',
          tags: ['#场照'], color: '#C5D9D5', h: 1.3, images: []
        });
        renderPhotoList();
        showToast('已新增作品');
      };

      window.addPhotoTag = function(idx, tag) {
        tag = tag.trim();
        if (!tag) return;
        if (!tag.startsWith('#')) tag = '#' + tag;
        if (config.photos[idx].tags.indexOf(tag) === -1) {
          config.photos[idx].tags.push(tag);
          renderPhotoList();
        }
      };

      window.removePhotoTag = function(idx, tagIdx) {
        config.photos[idx].tags.splice(tagIdx, 1);
        renderPhotoList();
      };

      window.savePhotos = function() {
        setConfig(config);
        showToast('作品数据已保存');
      };

      // ============================================
      // 价格管理
      // ============================================
      function renderPricingList() {
        // 场照
        var czList = document.getElementById('changzhaoList');
        if (czList) {
          czList.innerHTML = config.pricing.changzhao.map(function(item, i) {
            return '<div class="admin-list-item">' +
              '<div class="admin-list-item-header">' +
                '<span class="admin-list-item-title">' + esc(item.name) + '</span>' +
                '<button class="admin-btn admin-btn-del" onclick="deletePricingItem(\'changzhao\',' + i + ')">删除</button>' +
              '</div>' +
              '<div class="admin-list-item-fields">' +
                '<div class="admin-list-item-field"><label>名称</label><input class="admin-input" value="' + esc(item.name) + '" onchange="config.pricing.changzhao[' + i + '].name=this.value" /></div>' +
                '<div class="admin-list-item-field"><label>价格</label><input class="admin-input admin-input-sm" value="' + esc(item.price) + '" onchange="config.pricing.changzhao[' + i + '].price=this.value" /></div>' +
              '</div>' +
              '<div class="admin-list-item-field" style="margin-top:0.3rem"><label>项目（每行一项）</label><textarea class="admin-textarea" onchange="config.pricing.changzhao[' + i + '].items=this.value.split(\'\\n\').filter(Boolean)">' + (item.items||[]).join('\n') + '</textarea></div>' +
            '</div>';
          }).join('');
        }

        // 正片
        var zpList = document.getElementById('zhengpianList');
        if (zpList) {
          zpList.innerHTML = config.pricing.zhengpian.map(function(item, i) {
            return '<div class="admin-list-item">' +
              '<div class="admin-list-item-header">' +
                '<span class="admin-list-item-title">' + esc(item.name) + ' (' + esc(item.subtitle || '') + ')</span>' +
                '<button class="admin-btn admin-btn-del" onclick="deletePricingItem(\'zhengpian\',' + i + ')">删除</button>' +
              '</div>' +
              '<div class="admin-list-item-fields">' +
                '<div class="admin-list-item-field"><label>名称</label><input class="admin-input" value="' + esc(item.name) + '" onchange="config.pricing.zhengpian[' + i + '].name=this.value" /></div>' +
                '<div class="admin-list-item-field"><label>副标题</label><input class="admin-input" value="' + esc(item.subtitle||'') + '" onchange="config.pricing.zhengpian[' + i + '].subtitle=this.value" /></div>' +
                '<div class="admin-list-item-field"><label>价格</label><input class="admin-input admin-input-sm" value="' + esc(item.price) + '" onchange="config.pricing.zhengpian[' + i + '].price=this.value" /></div>' +
              '</div>' +
              '<div class="admin-list-item-field" style="margin-top:0.3rem"><label>项目（每行一项）</label><textarea class="admin-textarea" onchange="config.pricing.zhengpian[' + i + '].items=this.value.split(\'\\n\').filter(Boolean)">' + (item.items||[]).join('\n') + '</textarea></div>' +
            '</div>';
          }).join('');
        }

        renderAddonList('changzhaoAddons', 'changzhaoAddonsList');
        renderAddonList('zhengpianAddons', 'zhengpianAddonsList');
        renderNoteList('changzhaoNotes', 'changzhaoNotesList');
        renderNoteList('zhengpianNotes', 'zhengpianNotesList');
      }

      function renderAddonList(key, listId) {
        var list = document.getElementById(listId);
        if (!list) return;
        list.innerHTML = config.pricing[key].map(function(item, i) {
          return '<div class="admin-list-item">' +
            '<div class="admin-list-item-header">' +
              '<span class="admin-list-item-title">' + esc(item.label) + '</span>' +
              '<button class="admin-btn admin-btn-del" onclick="deleteAddon(\'' + key + '\',' + i + ')">删除</button>' +
            '</div>' +
            '<div class="admin-list-item-fields">' +
              '<div class="admin-list-item-field"><label>名称</label><input class="admin-input" value="' + esc(item.label) + '" onchange="config.pricing[\'' + key + '\'][' + i + '].label=this.value" /></div>' +
              '<div class="admin-list-item-field"><label>价格</label><input class="admin-input" value="' + esc(item.price) + '" onchange="config.pricing[\'' + key + '\'][' + i + '].price=this.value" /></div>' +
              '<div class="admin-list-item-field"><label>单位</label><input class="admin-input" value="' + esc(item.unit||'') + '" onchange="config.pricing[\'' + key + '\'][' + i + '].unit=this.value" /></div>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      function renderNoteList(key, listId) {
        var list = document.getElementById(listId);
        if (!list) return;
        list.innerHTML = config.pricing[key].map(function(item, i) {
          return '<div class="admin-notes-row">' +
            '<input class="admin-input note-title-input" value="' + esc(item.title) + '" onchange="config.pricing[\'' + key + '\'][' + i + '].title=this.value" />' +
            '<div style="display:flex;gap:0.3rem;align-items:center">' +
              '<input class="admin-input note-desc-input" style="flex:1" value="' + esc(item.desc) + '" onchange="config.pricing[\'' + key + '\'][' + i + '].desc=this.value" />' +
              '<button class="admin-btn admin-btn-del" onclick="deleteNote(\'' + key + '\',' + i + ')">删除</button>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      window.deletePricingItem = function(key, idx) {
        if (!confirm('确定删除？')) return;
        config.pricing[key].splice(idx, 1);
        renderPricingList();
        showToast('已删除');
      };

      window.addPricingItem = function(key) {
        if (key === 'changzhao') {
          config.pricing.changzhao.push({ name: '新套餐', price: '0', items: [''] });
        } else {
          config.pricing.zhengpian.push({ name: '新套餐', price: '0', subtitle: '', items: [''] });
        }
        renderPricingList();
        showToast('已新增');
      };

      window.deleteAddon = function(key, idx) {
        if (!confirm('确定删除？')) return;
        config.pricing[key].splice(idx, 1);
        renderPricingList();
        showToast('已删除');
      };

      window.addAddon = function(key) {
        config.pricing[key].push({ label: '新服务', price: '0', unit: '' });
        renderPricingList();
        showToast('已新增');
      };

      window.deleteNote = function(key, idx) {
        if (!confirm('确定删除？')) return;
        config.pricing[key].splice(idx, 1);
        renderPricingList();
        showToast('已删除');
      };

      window.addNote = function(key) {
        config.pricing[key].push({ title: '新条目', desc: '' });
        renderPricingList();
        showToast('已新增');
      };

      window.savePricing = function() {
        setConfig(config);
        showToast('价格配置已保存');
      };

      // ============================================
      // 导入 / 导出
      // ============================================
      window.exportConfig = function() {
        var json = JSON.stringify(config, null, 2);
        var blob = new Blob([json], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'site-config.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('已导出配置文件');
      };

      window.importConfig = function(event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
          try {
            config = JSON.parse(e.target.result);
            setConfig(config);
            renderPhotoList();
            renderPricingList();
            showToast('配置已导入');
          } catch(err) {
            showToast('JSON 格式错误，请检查文件');
          }
        };
        reader.readAsText(file);
        event.target.value = '';
      };

      window.resetConfig = function() {
        if (!confirm('确定重置为默认数据？当前修改将丢失。')) return;
        config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
        setConfig(config);
        renderPhotoList();
        renderPricingList();
        showToast('已重置为默认数据');
      };

      // ============================================
      // 初始化
      // ============================================
      renderPhotoList();
      renderPricingList();

      // 随机背景
      (function() {
        var bgColors = ['#C5D9D5', '#AADDD4', '#E6DFDF', '#7FEFD0', '#D4EDE8'];
        var c = bgColors[Math.floor(Math.random() * bgColors.length)];
        document.getElementById('bgLayer').style.background =
          'radial-gradient(ellipse at 30% 20%, ' + c + ' 0%, transparent 60%),' +
          'radial-gradient(ellipse at 70% 60%, rgba(127,239,208,0.25) 0%, transparent 50%),' +
          'var(--bg-deep)';
      })();
    </script>
  </body>
</html>
